<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LỊCH CỐNG HIẾN HGS - NỘI ĐỊA ONLINE</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

  <style>
    html { font-size: 16px; } 
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 1.25rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid rgba(255, 255, 255, 0.5); }
    .section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #1e40af; margin-bottom: 1rem; border-left: 4px solid #3b82f6; padding-left: 12px; }
    .btn-action { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-action:active { transform: scale(0.97); }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-weight: 600; z-index: 9999; animation: slideDownUp 2.5s forwards; }
    @keyframes slideDownUp { 0% { opacity: 0; transform: translate(-50%, -20px); } 15%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
    .day-container { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; background: white; }
    .staff-sub-table td { padding: 6px 10px !important; font-size: 0.85rem; }
    .arrow-icon { transition: transform 0.3s ease; }
    .details-open .arrow-icon { transform: rotate(180deg); }
    .details-content { display: none; }
    .details-open .details-content { display: block; }
    #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 10000; visibility: hidden; }
  </style>
</head>

<body class="p-4 md:p-8">
  <div id="loading-overlay"><div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div></div>

  <div class="max-w-2xl mx-auto space-y-6">
    <header class="text-center space-y-2">
      <h2 class="text-2xl font-black text-blue-800 tracking-tight uppercase">📅 HGS NỘI ĐỊA (TRỰC TUYẾN)</h2>
      <p id="status-online" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 inline-block px-3 py-1 rounded-full border border-emerald-100">● ĐANG ĐỒNG BỘ TRỰC TUYẾN</p>
    </header>

    <div class="glass-card p-5">
      <div class="section-title">👤 Lịch cá nhân của bạn</div>
      <div class="mb-4">
          <select id="employee-select" class="w-full border border-blue-200 rounded-xl text-base px-4 py-3 bg-blue-50 font-bold text-blue-900 outline-none focus:ring-2 focus:ring-blue-400">
              <option value="">-- Đang tải danh sách... --</option>
          </select>
      </div>
      <div id="days-container" class="grid grid-cols-1 gap-2"></div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <button id="calc-week" class="btn-action bg-blue-600 text-white rounded-xl py-4 font-bold shadow-lg">📅 TÍNH GIỜ</button>
        <button id="clear-ui" class="btn-action bg-slate-400 text-white rounded-xl py-4 font-bold shadow-lg">🧹 XÓA TRẮNG</button>
      </div>
    </div>

    <div id="result-container" class="hidden glass-card p-5">
      <div class="section-title">📊 Tổng hợp tuần</div>
      <div class="overflow-hidden rounded-xl border border-slate-100">
        <table class="w-full text-sm">
          <thead class="bg-slate-800 text-white">
            <tr><th class="px-3 py-3 text-left">Thứ</th><th class="px-3 py-3 text-left">Ca</th><th class="px-3 py-3 text-center">Vào</th><th class="px-3 py-3 text-center">Ra</th><th class="px-3 py-3 text-center">Tổng</th></tr>
          </thead>
          <tbody id="result-body" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>
    </div>

    <div class="glass-card p-5 border-t-4 border-t-indigo-500">
      <div class="section-title text-indigo-700">🔍 Chuyến bay & Đồng đội</div>
      <div class="relative mb-4">
        <input id="search-name" type="text" placeholder="Nhập tên nhân viên..." class="w-full border border-slate-200 rounded-xl px-4 py-3 pl-10 font-semibold outline-none focus:ring-2 focus:ring-indigo-400">
        <span class="absolute left-3 top-4 opacity-40">👤</span>
      </div>
      <div id="flight-result-area" class="space-y-3"></div>
    </div>

    <div class="glass-card p-6 bg-slate-100 border-2 border-slate-200">
        <div class="section-title text-slate-700">⚙️ QUẢN LÝ DỮ LIỆU CHUNG</div>
        <div class="space-y-4">
            <div class="relative overflow-hidden inline-block w-full">
                <button class="w-full bg-white border-2 border-dashed border-blue-400 text-blue-600 font-bold py-4 rounded-xl hover:bg-blue-50">📁 TẢI LỊCH EXCEL LÊN HỆ THỐNG</button>
                <input type="file" id="excel-upload" accept=".xls,.xlsx" class="absolute left-0 top-0 opacity-0 w-full h-full cursor-pointer">
            </div>
            <div class="flex items-center justify-between pt-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Cột M: FLT | Cột N: ETD | O-R: SUP/GATE/KS/WLC | S-AE: TV</span>
                <button id="btn-refresh" class="text-blue-500 text-[11px] font-bold hover:underline">🔄 LÀM MỚI</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-6">
        <a href="https://www.facebook.com/huy.hai.333030" target="_blank" class="text-sm font-bold text-blue-600">✨ Created by Hải 9 ✨</a>
    </footer>
  </div>

<script>
/* --- FIREBASE CONFIG --- */
const firebaseConfig = {
  apiKey: "AIzaSyA2scrs8GpNAWZ5ETId6z3vkUMmArD1yn8",
  authDomain: "hgs36-6db0b.firebaseapp.com",
  databaseURL: "https://hgs36-6db0b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hgs36-6db0b",
  storageBucket: "hgs36-6db0b.firebasestorage.app",
  messagingSenderId: "356125658008",
  appId: "1:356125658008:web:aec521395459b2192579ed",
  measurementId: "G-JZVNL3EWSQ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const c = id => document.getElementById(id);
const days = ["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ Nhật"];
const daysOrder = ["MON","TUE","WED","THU","FRI","SAT","SUN"];

let employeeData = [];
let flightData = [];

/* --- UTILS --- */
function showLoading(s){ c('loading-overlay').style.visibility = s ? 'visible' : 'hidden'; }
function showToast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
function normalizeText(s){ return s ? s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Z0-9\s\-]/gi,'').trim().replace(/\s+/g,' ').toUpperCase() : ""; }
function excelTimeToHHMM(v){ if(typeof v==='number'){ const total=Math.round(v*24*60); return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0'); } return String(v||"").trim(); }

const shifts={ HC:{start:7.5,end:15.5},A:{start:22,end:30},X:{start:14,end:22},S:{start:6,end:14} };
function parseShift(str){
    str=(str||"").toUpperCase().trim(); if(!str || str==="OFF" || str==="OM") return {start:0,end:0,dur:0};
    const re_f=/^(\d*\.?\d*-?)?(H|DH|M)(\d*\.?\d*)?(-?\d*\.?\d*)?$/; const m_f = re_f.exec(str);
    if(m_f){
        let d=8, s=8; if(m_f[2]==="DH"||m_f[2]==="M") d=parseFloat(m_f[3])||0;
        else if(m_f[2]==="H"){ if(m_f[3]) d=parseFloat(m_f[3]); if(/H4S/.test(str)) {s=8;d=4;} else if(/H4C/.test(str)){s=14;d=4;} }
        let e=s+d; if(m_f[1]){ const v=parseFloat(m_f[1].replace("-","")); m_f[1].includes("-")?s+=v:s-=v; }
        if(m_f[4]){ const v=parseFloat(m_f[4].replace("-","")); m_f[4].startsWith("-")?e-=v:e+=v; }
        return {start:s, end:e, dur: e-s};
    }
    const re=/^(\d*\.?\d*-?)?([A-Z]{1,2})(-?\d*\.?\d*)?$/; const m=re.exec(str);
    if(!m || !shifts[m[2]]) return {start:8, end:16, dur:8};
    let {start,end}=shifts[m[2]]; if(m[1]){ const v=parseFloat(m[1].replace("-","")); m[1].includes("-")?start+=v:start-=v; }
    if(m[3]){ const v=parseFloat(m[3].replace("-","")); m[3].startsWith("-")?end-=v:end+=v; }
    return {start, end, dur: end-start};
}
function fmtHours(t){ const hh=Math.floor(t%24); const mm=Math.round((t%1)*60); return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }

/* --- XỬ LÝ EXCEL THEO YÊU CẦU --- */
function processExcel(data){
    showLoading(true);
    const wb = XLSX.read(data, {type:"array"});
    let allEmp = [];
    
    // 1. Đọc Chấm công (Cột B, và các cặp cột CE, FH, IK, LN, OQ, RT, UW)
    ["bảng chấm công qt","bảng chấm công nđ"].forEach(t => {
        const sn = wb.SheetNames.find(n => n.trim().toLowerCase() === t);
        if(sn){
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1});
            rows.slice(1).forEach(row => {
                if(row[1]) allEmp.push({
                    name: String(row[1]).trim(), 
                    mon: (row[2]||"")+(row[4]?';'+row[4]:""), 
                    tue: (row[5]||"")+(row[7]?';'+row[7]:""), 
                    wed: (row[8]||"")+(row[10]?';'+row[10]:""), 
                    thu: (row[11]||"")+(row[13]?';'+row[13]:""), 
                    fri: (row[14]||"")+(row[16]?';'+row[16]:""), 
                    sat: (row[17]||"")+(row[19]?';'+row[19]:""), 
                    sun: (row[20]||"")+(row[22]?';'+row[22]:"")
                });
            });
        }
    });

    // 2. Đọc Chuyến bay (Cột M, N và nhân viên cùng dòng)
    let allFlt = [];
    const namePattern = /([\p{L}Đđ\s\-]+?)(?:\s+(\d{1,4}))?$/u;

    daysOrder.forEach(dName => {
        const sn = wb.SheetNames.find(n => n.trim().toUpperCase() === dName);
        if(!sn) return;
        const sheet = wb.Sheets[sn];
        
        for(let r=4; r<=150; r++){ // Quét tối đa 150 dòng
            const fCell = sheet[XLSX.utils.encode_cell({c:12, r:r})]; // Cột M
            const eCell = sheet[XLSX.utils.encode_cell({c:13, r:r})]; // Cột N
            
            // CHỈ XỬ LÝ NẾU DÒNG CÓ SỐ HIỆU CHUYẾN BAY (CỘT M)
            if(!fCell || !fCell.v) continue;

            const flt = String(fCell.v).trim();
            const etd = eCell !== undefined ? excelTimeToHHMM(eCell.v) : "";

            // Quét từ O (14) đến AE (30) TRÊN CÙNG DÒNG R NÀY
            for(let cIdx=14; cIdx<=30; cIdx++){
                const cell = sheet[XLSX.utils.encode_cell({c:cIdx, r:r})];
                if(cell && cell.v){
                    const rawLines = String(cell.v).trim().split('\n');
                    rawLines.forEach(line => {
                        const m = line.trim().match(namePattern);
                        if(m){
                            const fullName = m[0].trim().toUpperCase();
                            allFlt.push({
                                sheet: dName, flt, etd,
                                nameOnly: fullName,
                                nameNormalized: normalizeText(fullName),
                                isSup: (cIdx === 14), // O
                                isGate: (cIdx === 15), // P
                                isKetso: (cIdx === 16), // Q
                                isWlc: (cIdx === 17), // R
                                isTv: (cIdx >= 18) // S-AE
                            });
                        }
                    });
                }
            }
        }
    });

    db.ref('hgs_nd_data').set({ employeeData: allEmp, flightData: allFlt })
    .then(() => { showLoading(false); showToast("🚀 Đã cập nhật đúng logic dòng!"); })
    .catch(err => { showLoading(false); alert("Lỗi: " + err.message); });
}

/* --- ĐỒNG BỘ & HIỂN THỊ --- */
function syncFromFirebase(){
    showLoading(true);
    db.ref('hgs_nd_data').on('value', snapshot => {
        const val = snapshot.val();
        if(val){
            employeeData = val.employeeData || [];
            flightData = val.flightData || [];
            updateDropdown();
        }
        showLoading(false);
    });
}

function updateDropdown(){
    const sel = c("employee-select");
    const oldVal = sel.value;
    sel.innerHTML = '<option value="">-- Chọn tên từ danh sách --</option>';
    employeeData.sort((a,b)=>a.name.localeCompare(b.name, "vi")).forEach(e => {
        sel.innerHTML += `<option value="${e.name}">${e.name}</option>`;
    });
    if(oldVal) sel.value = oldVal;
}

function renderFlightResults(nameRaw){
    const container = c("flight-result-area");
    const qNorm = normalizeText(nameRaw);
    const myFlights = flightData.filter(f => f.nameNormalized === qNorm);
    
    if(!myFlights.length){ 
        container.innerHTML = "<p class='text-center text-slate-400 py-6 italic'>Nhân viên này không có chuyến bay nào.</p>"; 
        return; 
    }

    let html = "";
    daysOrder.forEach(day => {
        const dayF = myFlights.filter(f => f.sheet === day);
        if(!dayF.length) return;

        html += `<div class="p-3 bg-white border border-slate-200 rounded-2xl shadow-sm mb-3">
                    <div class="font-bold text-blue-800 text-xs mb-2 px-1 uppercase">📅 ${day}</div>`;
        
        dayF.forEach((mf, i) => {
            const accId = `acc-${day}-${i}`;
            const colleagues = flightData.filter(f => f.sheet === day && f.flt === mf.flt && f.etd === mf.etd);
            const pos = mf.isSup?'SUP':mf.isGate?'GATE':mf.isKetso?'KS':mf.isWlc?'WLC':'TV';

            html += `<div class="border-b last:border-0 pb-2 mb-2" id="${accId}">
                <div class="flex items-center justify-between cursor-pointer" onclick="document.getElementById('${accId}').classList.toggle('details-open')">
                    <div class="flex items-center gap-2">
                        <span class="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px] font-black">${mf.flt}</span>
                        <span class="text-sm font-bold text-slate-700">${mf.etd}</span>
                        <span class="text-[10px] font-bold text-rose-500 uppercase">[${pos}]</span>
                    </div>
                    <span class="arrow-icon text-slate-300">▼</span>
                </div>
                <div class="details-content mt-2 bg-slate-50 rounded-xl p-2">
                    <table class="staff-sub-table w-full">`;
            
            colleagues.forEach(col => {
                const emp = employeeData.find(e => normalizeText(e.name) === col.nameNormalized);
                const shift = emp ? (emp[day.toLowerCase()] || "OFF") : "---";
                const role = col.isSup?'SUP':col.isGate?'GATE':col.isKetso?'KS':col.isWlc?'WLC':'TV';
                html += `<tr class="${col.nameNormalized===qNorm?'bg-blue-100/60':''}">
                    <td class="font-bold text-slate-800">${col.nameOnly}</td>
                    <td class="text-[10px] font-bold text-blue-600 uppercase">${role}</td>
                    <td class="text-right font-mono font-bold text-slate-500">${shift}</td>
                </tr>`;
            });
            html += `</table></div></div>`;
        });
        html += `</div>`;
    });
    container.innerHTML = html;
}

/* --- EVENTS --- */
c("excel-upload").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = evt => processExcel(new Uint8Array(evt.target.result));
    r.readAsArrayBuffer(f);
};

c("employee-select").onchange = e => {
    const n = e.target.value; if(!n) return;
    const emp = employeeData.find(x=>x.name===n);
    if(emp) daysOrder.forEach((d,i) => c("day"+i).value = emp[d.toLowerCase()] || "");
    c("search-name").value = n; renderFlightResults(n);
};

c("search-name").oninput = e => renderFlightResults(e.target.value);

c("calc-week").onclick = () => {
    const tbody = c("result-body"); tbody.innerHTML = ""; let tot = 0;
    days.forEach((d, i) => {
        const v = c("day"+i).value.trim(); if(!v) return;
        v.split(";").forEach((p, idx) => {
            const r = parseShift(p);
            if(r.dur > 0){
                tbody.innerHTML += `<tr><td class="py-3 px-3 font-bold">${idx===0?d:''}</td><td><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold border border-blue-100">${p}</span></td><td class="text-center font-mono text-xs">${fmtHours(r.start)}</td><td class="text-center font-mono text-xs">${fmtHours(r.end)}</td><td class="text-center font-bold text-blue-600">${r.dur.toFixed(1)}h</td></tr>`;
                tot += r.dur;
            }
        });
    });
    tbody.innerHTML += `<tr class="bg-slate-800 text-white font-bold"><td colspan="4" class="p-3 text-[10px]">TỔNG CỘNG</td><td class="text-center text-lg">${tot.toFixed(1)}h</td></tr>`;
    c("result-container").classList.remove("hidden");
};

c("clear-ui").onclick = () => { days.forEach((_,i)=>c("day"+i).value=""); c("result-container").classList.add("hidden"); };
c("btn-refresh").onclick = () => location.reload();

document.addEventListener("DOMContentLoaded", () => {
    const box = c("days-container");
    days.forEach((d,i) => {
        box.innerHTML += `<div class="day-container"><label class="block text-[10px] font-black text-slate-400 uppercase mb-1">${d}</label><input id="day${i}" type="text" placeholder="..." class="w-full bg-transparent font-bold outline-none"></div>`;
    });
    syncFromFirebase();
});
</script>
</body>
</html>
